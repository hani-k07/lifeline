name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests (engine and auth must stay at 90% coverage or better)
        run: pytest --cov=lifeline.engine --cov=lifeline.auth --cov-fail-under=90
